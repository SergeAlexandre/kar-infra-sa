apiVersion: v1alpha1


services:
  - name: metallb
    version: 1.0.0
    helmCharts:
      - name: main
        config:
          install:
            createNamespace: true
        source:
          helmRepository:
            url: https://metallb.github.io/metallb
            chart: metallb
            version: 0.14.4
    roles:
      - loadBalancer